<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Types & Float</title>

    <style>
        .box1, .box2 {
            display: inline-block;
            width: 150px;
            height: 100px;
            color: white;
            text-align: center;
            line-height: 100px;
            margin-right: 10px;
        }

        .box1 {
            background-color: tomato;
        }

        .box2 {
            background-color: steelblue;
        }

        .text {
            clear: both;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    <p class="text">This text should appear below boxes.</p>

</body>
</html>
