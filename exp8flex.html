<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .body{
            font-family: Arial, sans-serif;
            background-color: rgb(229,229,205);
            margin:20px;
        }
        .container{
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: #f4f4f4;
            padding: 10px;
            border:1px solid #ccc;
        }
        .box{
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        .box1{background-color: #ff5733; }
        .box2{background-color: #33c1ff; }
        .box3{background-color: #75ff33; }
        .box4{background-color: #ff33a6;}
        .box5{background-color: #ffa533; } 
        .box6{background-color: #8e33ff; }
    </style>
    <title>DOCUMENT</title>
</head>
<body>
    <h1> FLEXIBLE LAYOUT PLAYGROUND</h1>
    <div class="container">
        <div class="box box1">box 1</div>
        <div class="box box2">box 2</div>
        <div class="box box3">box 3</div>
        <div class="box box4">box 4</div>
        <div class="box box5">box 5</div>
        <div class="box box6">box 6</div>
    </div>
    
</body>
</html>
