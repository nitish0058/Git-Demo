<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-commerce product card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <h1>MY E-commerce Store</h1>
    <div class =" product-card">
        <img src="image.png" alt="Product Image" class="product-image" height="150px" width="250px">
        <h2><b>Stylish T-Shirt</b></h2>
        <p class="product-description"><i>A comfortable and trendy cotton t-shirt perfect for casual wear.</i></p>
        <div class="product-price">$500</div>
        <button class="add-to-cart-button">Add to Cart</button>
    </div>
    
</body>
</html>
