<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple product page</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body> 
    <h1>Navigation Memo Demo</h1>
    <h2 style="color:rgb(32,4,58)">Block Example</h2>
    <div class ="block-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">about</a>
        <a href="#">contact</a>
    </div>
    <h2 style="color:rgb(32,4,58)">Inline Example</h2>
    <div class="inline-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">about</a>
        <a href="#">contact</a>
    </div>
    <h2 style="color:rgb(32,4,58)">Inline-block example</h2>
    <div class="inline-block-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">about</a>
        <a href="#">contact</a>
    </div>
    <h2 style="color:rgb(32,4,58)">float example</h2>
    <div class="float-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">about</a>
        <a href="#">contact</a>
    </div>
    <div class="clear-example">
        <p>This text comes <b>after</b> clearing floats.
        It will appear below the orange menu above.</p>
    </div>
    </body>
    </html>
