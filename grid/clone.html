<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="clone.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">amazon</div>

        <div class="search-box">
            <input type="text" placeholder="Search Amazon">
            <button>Search</button>
        </div>

        <div class="nav-links">
            <p>Hello, Sign in</p>
            <p>Returns & Orders</p>
            <p class="cart">Cart</p>
        </div>
    </div>

    <!-- Banner -->
    <div class="banner">
        <h1>Big Sale is Live!</h1>
        <p>Up to 50% off on electronics</p>
    </div>

    <!-- Products Section -->
    <div class="products">
        <div class="product">
            <h3>Electronics</h3>
            <img src="https://via.placeholder.com/200">
            <p>Shop now</p>
        </div>

        <div class="product">
            <h3>Fashion</h3>
            <img src="https://via.placeholder.com/200">
            <p>Shop now</p>
        </div>

        <div class="product">
            <h3>Home & Kitchen</h3>
            <img src="https://via.placeholder.com/200">
            <p>Shop now</p>
        </div>

        <div class="product">
            <h3>Books</h3>
            <img src="https://via.placeholder.com/200">
            <p>Shop now</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Amazon Clone | Made for Educational Purpose</p>
    </footer>

</body>
</html>
