<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar container */
        .navbar {
            display: flex;
            justify-content: space-between; /* Logo left, menu right */
            align-items: center;
            background-color: #2196f3;
            color: white;
            padding: 10px 20px;
        }

        /* Logo */
        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        /* Menu links */
        .menu a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 12px;
            transition: background-color 0.3s;
        }

        .menu a:hover {
            background-color: rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        /* Responsive: Stack links on small screens */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .menu {
                display: flex;
                flex-direction: column;
                width: 100%;
                margin-top: 10px;
            }

            .menu a {
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">MySite</div>
        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

</body>
</html>
