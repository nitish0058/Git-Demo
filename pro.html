<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
</head>
<body>

  <!-- Page Title -->
  <h1 id="title">Student Feedback Survey</h1>

  <!-- Description -->
  <p id="description">
    Please fill out this survey to help us improve our learning experience.
  </p>

  <!-- Form -->
  <form id="survey-form">

    <!-- Name -->
    <label id="name-label" for="name">Name:</label><br>
    <input 
      type="text" 
      id="name" 
      name="name" 
      placeholder="Enter your name" 
      required
    ><br><br>

    <!-- Email -->
    <label id="email-label" for="email">Email:</label><br>
    <input 
      type="email" 
      id="email" 
      name="email" 
      placeholder="Enter your email" 
      required
    ><br><br>

    <!-- Number -->
    <label id="number-label" for="number">Age:</label><br>
    <input 
      type="number" 
      id="number" 
      name="age" 
      min="10" 
      max="99" 
      placeholder="Enter your age"
      required
    ><br><br>

    <!-- Dropdown -->
    <label for="dropdown">Which option best describes you?</label><br>
    <select id="dropdown" name="role">
      <option value="student">Student</option>
      <option value="professional">Professional</option>
    </select><br><br>

    <!-- Radio Buttons -->
    <p>Would you recommend freeCodeCamp?</p>
    <input type="radio" name="recommend" value="yes"> Yes<br>
    <input type="radio" name="recommend" value="no"> No<br><br>

    <!-- Checkboxes -->
    <p>What topics are you interested in?</p>
    <input type="checkbox" value="html"> HTML<br>
    <input type="checkbox" value="css"> CSS<br>
    <input type="checkbox" value="javascript"> JavaScript<br><br>

    <!-- Textarea -->
    <label for="comments">Additional Comments:</label><br>
    <textarea id="comments" rows="4" cols="40"></textarea><br><br>

    <!-- Submit Button -->
    <button id="submit" type="submit">Submit</button>

  </form>

</body>
</html>
